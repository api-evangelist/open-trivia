aid: open-trivia
name: Open Trivia Database
description: >-
  The Open Trivia Database (OpenTDB) is a free, user-contributed trivia question
  database operated by Pixeltail Games LLC. It offers a JSON REST API for
  retrieving thousands of community-verified trivia questions across 24
  categories and three difficulty levels, with optional session tokens to prevent
  duplicate questions. The service is licensed Creative Commons
  Attribution-ShareAlike 4.0 International (CC BY-SA 4.0), is free at the point
  of use, and enforces a single throttling rule: one request per IP every five
  seconds.
