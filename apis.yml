apis:
  - name: Open Trivia Database API
    description: >-
      JSON REST API that returns multiple-choice and true/false trivia questions
      drawn from a community-curated database of over 5,000 verified questions
      across 24 categories. Supports filtering by category, difficulty, and
      question type, optional response encoding (HTML entities, URL legacy,
      RFC 3986, Base64), and session tokens to prevent duplicate questions
      within a six-hour window.
